    <text style="font-size: 5.4px; font-family: 'Arial'; fill: #d53e4f" transform="translate(143.859656 193.751606)">hiracin JM79-like (59.3% vs hiracin JM79)</text>
    <text style="font-size: 5.4px; font-family: 'Arial'; fill: #d53e4f" transform="translate(166.656094 199.5264)">no conjugation module</text>
   </g>
   <g id="text_10">
